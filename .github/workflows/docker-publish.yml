name: Docker images
on:
    push:
        # branches: ['master']
        # Publish semver tags as releases.
        tags: ['v*']
    pull_request:
        branches: ['master']

env:
    # Use docker.io for Docker Hub if empty europe-west1-docker.pkg.dev/gen-lang-client-0069544432/ason-speedtest/ason-speedtest
    # REGISTRY: ghcr.io
    # github.repository as <account>/<repo>
    PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
    IMAGE_NAME: "ason-speedtest"
    PLATFORMS: linux/amd64,linux/arm64,linux/arm/v7,linux/386
    GAR_LOCATION: "europe-west1"
    GAR_REPO: "ason-speedtest"

jobs:
    build:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            id-token: 'write'
            packages: write

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Set up QEMU
              uses: docker/setup-qemu-action@v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4

            - name: Authenticate to Google Cloud
              id: auth
              uses: google-github-actions/auth@v3
              with:
                  project_id: ${{ env.PROJECT_ID }}
                  workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}

            # Login against a Docker registry except on PR
            # https://github.com/docker/login-action
            - name: Log into registry ghcr.io
              id: docker-auth-github
              uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Log into registry google
              id: docker-auth-google
              uses: docker/login-action@v4
              with:
                  registry: ${{ env.GAR_LOCATION }}-docker.pkg.dev
                  username: 'oauth2accesstoken'
                  password: ${{ steps.auth.outputs.access_token }}

            # Extract metadata (tags, labels) for Docker
            # https://github.com/docker/metadata-action
            - name: Extract Docker metadata
              id: meta
              uses: docker/metadata-action@v6
              with:
                  images: |
                    ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPO }}/${{ env.IMAGE_NAME }}
                    ghcr.io/${{ github.repository }}/${{ env.IMAGE_NAME }}
                  tags: |
                    type=sha,format=long
                    type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

            # Build and push Docker image with Buildx (don't push on PR)
            # https://github.com/docker/build-push-action
            - name: Build and Push to Both Registries Docker image
              id: build-and-push
              uses: docker/build-push-action@v7
              with:
                  context: .
                  push: ${{ github.event_name != 'pull_request' }}
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  platforms: ${{ env.PLATFORMS }}
